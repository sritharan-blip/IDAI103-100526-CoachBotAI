[theme]
base = "dark"
primaryColor = "#d6ff39"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#171717"
textColor = "#f5f5f0"
font = "sans-serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false
