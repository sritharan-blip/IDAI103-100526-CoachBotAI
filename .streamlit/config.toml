[theme]
base = "dark"
primaryColor = "#8eeaff"
backgroundColor = "#101213"
secondaryBackgroundColor = "#1b2022"
textColor = "#f5f5f0"
font = "sans-serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false
