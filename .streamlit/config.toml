[theme]
base = "dark"
primaryColor = "#76deff"
backgroundColor = "#11151a"
secondaryBackgroundColor = "#202830"
textColor = "#f5f5f0"
font = "sans-serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false
